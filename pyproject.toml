[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cjapy"
authors = [
    {name = "Julien Piccini", email = "piccini.julien@gmail.com"},
]
description = "Adobe Customer Journey Analytics (CJA) wrapper"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["adobe", "analytics", "API", "python"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta"
]
dependencies = [
        "pandas",
        "requests",
        "deprecation",
    ]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/pitchmuc/cjapy"
changelog = "https://github.com/pitchmuc/cjapy/blob/master/docs/releases.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cjapy", "cjapy.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "cjapy.__version__.__version__"}

[project.optional-dependencies]
test = ["pytest>=9.0.3"]
